name: SDK

on:
  push:
    branches:
      - "master"
    paths:
      - "packages/login-sync/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "packages/login-sync/**"
      - ".github/workflows/sdk.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./packages/login-sync

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The smoke step runs the built package under Node, outside Bun
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome ci .

      - name: Typecheck
        run: bun run compile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke test the build on Node
        run: bun run smoke
