name: Extension

on:
  push:
    branches:
      - "master"
    tags:
      # Tag format created by Changesets in workspace mode:
      # `<workspace-package-name>@<version>` (e.g. `laplace-login-sync@2.0.3`).
      - "laplace-login-sync@*"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/extension/**"
      # The extension bundles the SDK's source, and nothing else from the package
      - "packages/login-sync/src/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./apps/extension

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build + zip (Chrome MV3)
        run: bun run zip

      - name: Build + zip (Firefox MV2)
        run: bun run zip:firefox

      - name: Store the packaged zips
        uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: apps/extension/.output/*.zip
          # WXT writes to `.output/`, which actions/upload-artifact treats as
          # a hidden directory and excludes from the artifact by default
          # (since v4.4). Without this, the upload silently uploads nothing
          # and the downstream publish/release jobs have no zips to attach.
          include-hidden-files: true
          if-no-files-found: error

  store-publish:
    name: Publish to store
    runs-on: ubuntu-latest

    # Publish only on `laplace-login-sync@*` tag pushes (created by changesets
    # when the "Version Packages" PR merges).
    if: startsWith(github.ref, 'refs/tags/laplace-login-sync@')

    needs:
      - build

    defaults:
      run:
        working-directory: ./apps/extension

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the packaged zips
        uses: actions/download-artifact@v8
        with:
          name: extension-builds
          path: apps/extension/.output/

      # `wxt submit` wraps publish-browser-extension, which reads these env vars:
      # https://github.com/aklinker1/publish-browser-extension/blob/main/docs/config-reference.md
      # Run `bun x wxt submit init` locally to generate the secrets.
      - name: Submit to stores
        env:
          # CWS API v2 authenticates as a Google Cloud service account (v1.1 ends 2026-10-15).
          # Setup: https://developer.chrome.com/docs/webstore/service-accounts
          # 1. Cloud console: enable "Chrome Web Store API"; create a service account (no
          #    roles); on its Keys tab, Add key > Create new key > JSON. Orgs created since
          #    2024-05-03 block that by default (policy iam.disableServiceAccountKeyCreation).
          # 2. CWS Developer Dashboard: pick this item's publisher (top-right), open its Settings
          #    page (older docs: "Account"), add the email under "Service account". Needs the
          #    Editor or Admin role; one per publisher, and it can publish all its items.
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          # Dashboard > Publisher > Settings, or the UUID in the devconsole/<id> URL
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          # `client_email` and `private_key` from the JSON key
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_SKIP_SUBMIT_REVIEW: false
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_SKIP_SUBMIT_REVIEW: false
        run: |
          # Unescape `\n` so the secret can also be a JSON key file's one-line `private_key`
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$(printf '%b' "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY")"
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY
          bun x wxt submit \
            --chrome-zip .output/*-chrome.zip \
            --edge-zip .output/*-chrome.zip \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest

    # Same gate as the publish job: only attach extension zips to
    # `laplace-login-sync@*` tag releases.
    if: startsWith(github.ref, 'refs/tags/laplace-login-sync@')

    needs:
      - build

    permissions:
      # IMPORTANT: mandatory for making GitHub Releases
      contents: write

    steps:
      # checkout is required for gh cli to work
      - uses: actions/checkout@v7

      - name: Download the packaged zips
        uses: actions/download-artifact@v8
        with:
          name: extension-builds
          path: apps/extension/.output/

      # Create the release if it doesn't already exist. The legacy
      # extension.yml workflow may have created it on the same tag, in which
      # case we just append the v2 zips to it below.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --notes "" --repo "${{ github.repository }}"
          fi

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # `--clobber` so re-runs (or coexistence with the legacy workflow)
        # don't fail when filenames overlap.
        run: >-
          gh release upload '${{ github.ref_name }}' apps/extension/.output/*.zip
          --clobber --repo '${{ github.repository }}'
