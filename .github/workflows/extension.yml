name: Extension

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build:
    # runs-on: ubuntu-latest
    # TODO: https://github.com/PlasmoHQ/plasmo/issues/1156
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-extension-

      - name: Install dependencies
        run: pnpm install

      - name: Build the extension
        run: pnpm build

      - name: Package the extension into a zip artifact
        run: pnpm package

      - name: Store the packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: extension/build/

  store-publish:
    name: Publish to store
    runs-on: ubuntu-latest

    # Only publish on tag pushes
    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: extension/build/

      - name: Browser platform publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.BPP_KEYS }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest

    # Only publish on tag pushes
    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build

    permissions:
      # IMPORTANT: mandatory for making GitHub Releases
      contents: write

    steps:
      # checkout is required for gh cli to work
      - uses: actions/checkout@v4

      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: extension/build/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          --notes ""

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload
          '${{ github.ref_name }}' extension/build/*.zip
          --repo '${{ github.repository }}'
