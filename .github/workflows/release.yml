name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # `changeset publish` publishes @laplace.live/login-sync with `npm publish` over npm trusted publishing (OIDC,
      # hence `id-token: write`), which needs Node >= 22.14 and npm >= 11.5.1. Upgrade the npm that setup-node puts on
      # PATH; `sudo npm` would upgrade the runner's system copy instead.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install -g npm@latest

      # Release writes (the version PR, tags and GitHub Releases) use a GitHub
      # App token instead of `GITHUB_TOKEN`. Events caused by `GITHUB_TOKEN`
      # don't trigger other workflows, so the release tags would never start
      # extension.yml, and checks on the version PR would wait for manual
      # approval.
      #
      # Requires the laplace-release-bot GitHub App installed on this repo with
      # Contents and Pull requests read & write, its Client ID and private key
      # stored in the `RELEASE_APP_CLIENT_ID` and `RELEASE_APP_PRIVATE_KEY` org
      # secrets.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create release PR or push tags
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: bun run release
          version-script: bun run version
          # Releases are immutable once published, so nothing can be attached
          # afterwards: the action only pushes tags, and each release is
          # published whole, by github-releases below or, with its zips, by
          # extension.yml, which the pushed extension tag fires.
          create-github-releases: false
          commit-message: "chore: version packages [skip ci]"
          pr-title: "chore: version packages"
          # Used for the version PR and tags, so the tags trigger
          # extension.yml. v2 reads the token only from this input,
          # not from the `GITHUB_TOKEN` env var.
          github-token: ${{ steps.app-token.outputs.token }}

  # Reconciles rather than trusting this run's publish output, so a rerun or the
  # next push recovers a release that failed to publish.
  github-releases:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish releases for tagged versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The extension's release is published by extension.yml, with its zips attached.
          for manifest in apps/*/package.json packages/*/package.json; do
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            tag="$name@$version"
            [ "$name" = "laplace-login-sync" ] && continue
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || continue
            sh .github/scripts/changelog-section.sh "$(dirname "$manifest")/CHANGELOG.md" "$version" > notes.md
            sh .github/scripts/publish-release.sh "$tag" notes.md
          done
