name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Authenticate git with a PAT so the tag push performed by
          # changesets/action triggers downstream workflows (extension.yml).
          # The default GITHUB_TOKEN cannot create recursive workflow runs,
          # so tag pushes made with it are silently dropped. See:
          # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
          token: ${{ secrets.RELEASE_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: sudo npm install -g npm@latest

      - name: Create release PR or push tags
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version
          # Create one GitHub Release per package tag, with the new
          # changelog entry as the release body. Per-package publish
          # workflows append their built artifacts to these releases.
          createGithubReleases: true
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          # Same PAT as the checkout step. Used by changesets/action for
          # API calls (creating the version PR, GitHub releases) AND
          # propagated to git pushes so the tag push triggers downstream
          # workflows.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          NPM_TOKEN: ""
