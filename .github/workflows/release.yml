name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: sudo npm install -g npm@latest

      # Release writes (the version PR, tags and GitHub Releases) use a GitHub
      # App token instead of `GITHUB_TOKEN`. Events caused by `GITHUB_TOKEN`
      # don't trigger other workflows, so the release tags would never start
      # extension.yml, and checks on the version PR would wait for manual
      # approval.
      #
      # Requires the laplace-release-bot GitHub App installed on this repo with
      # Contents and Pull requests read & write, its Client ID and private key
      # stored in the `RELEASE_APP_CLIENT_ID` and `RELEASE_APP_PRIVATE_KEY` org
      # secrets.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create release PR or push tags
        uses: changesets/action@v2
        with:
          publish-script: bun run release
          version-script: bun run version
          # Create one GitHub Release per package tag, with the new
          # changelog entry as the release body. Per-package publish
          # workflows append their built artifacts to these releases.
          create-github-releases: true
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # Used for the version PR, tags and GitHub Releases, so the tags
          # trigger extension.yml. v2 reads the token only from this input,
          # not from the `GITHUB_TOKEN` env var.
          github-token: ${{ steps.app-token.outputs.token }}
