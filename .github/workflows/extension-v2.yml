name: Extension v2

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
    paths:
      - "extension-v2/**"
      - ".github/workflows/extension-v2.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "extension-v2/**"
      - ".github/workflows/extension-v2.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./extension-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build + zip (Chrome MV3)
        run: bun run zip

      - name: Build + zip (Firefox MV2)
        run: bun run zip:firefox

      - name: Store the packaged zips
        uses: actions/upload-artifact@v4
        with:
          name: extension-v2-builds
          path: extension-v2/.output/*.zip

  store-publish:
    name: Publish to store
    runs-on: ubuntu-latest

    # Publish only on `v*` tag pushes (created by changesets when the
    # "Version Packages" PR merges).
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build

    defaults:
      run:
        working-directory: ./extension-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the packaged zips
        uses: actions/download-artifact@v4
        with:
          name: extension-v2-builds
          path: extension-v2/.output/

      # See https://wxt.dev/guide/essentials/publishing.html
      # Run `bun x wxt submit init` locally to generate the secrets below.
      - name: Submit to stores
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: default
          CHROME_SKIP_SUBMIT_REVIEW: false
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_SKIP_SUBMIT_REVIEW: false
        run: |
          bun x wxt submit \
            --chrome-zip .output/*-chrome.zip \
            --edge-zip .output/*-chrome.zip \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest

    # Same gate as the publish job: only attach extension zips to
    # `v*` tag releases.
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build

    permissions:
      # IMPORTANT: mandatory for making GitHub Releases
      contents: write

    steps:
      # checkout is required for gh cli to work
      - uses: actions/checkout@v4

      - name: Download the packaged zips
        uses: actions/download-artifact@v4
        with:
          name: extension-v2-builds
          path: extension-v2/.output/

      # Create the release if it doesn't already exist. The legacy
      # extension.yml workflow may have created it on the same tag, in which
      # case we just append the v2 zips to it below.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --notes "" --repo "${{ github.repository }}"
          fi

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # `--clobber` so re-runs (or coexistence with the legacy workflow)
        # don't fail when filenames overlap.
        run: >-
          gh release upload '${{ github.ref_name }}' extension-v2/.output/*.zip
          --clobber --repo '${{ github.repository }}'
